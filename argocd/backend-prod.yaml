apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Newt20/capstone-project.git
    targetRevision: main
    path: k8s/prod/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: support-chat-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
