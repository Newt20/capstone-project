apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-dev
  namespace: argocd
spec:
  project: default
  source:
    # Argo CD always tracks `main` here, never dev/stage/prod - see
    # understanding.md for why manifests live on a separate ledger branch
    # from application code.
    repoURL: https://github.com/Newt20/capstone-project.git
    targetRevision: main
    path: k8s/dev/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: support-chat-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
