name: CI

# Runs on every push and pull_request that touches an environment branch.
# This is pure validation - it never builds/pushes images and never deploys
# anything. It's the gate that dev/stage/prod branch protection requires to
# be green before a merge is allowed.
#
# Deliberately NOT path-filtered: frontend-ci/backend-ci are required status
# checks on dev/stage/prod, so any PR whose diff doesn't happen to touch
# frontend/**, backend/**, or .github/workflows/** would never get a status
# reported and would be stuck "waiting" forever (hit this for real with a
# .gitignore-only change). Always running both jobs costs a bit of runner
# time but is the only way a required check reliably resolves for every PR.
on:
  push:
    branches: [dev, stage, prod]
  pull_request:
    branches: [dev, stage, prod]
  # Also invoked directly by deploy.yml so every CD run re-validates the
  # exact commit it's about to build, without duplicating these steps.
  workflow_call:

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type-check + build
        run: yarn build

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
