name: CD - Dev

# Manual deploy only. Deliberately NOT triggered by push - landing a commit
# on `dev` must never, by itself, cause a deployment. A human decides when
# by clicking "Run workflow" (or `gh workflow run cd-dev.yml --ref dev`).
on:
  workflow_dispatch: {}

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      env_name: dev
      image_target: development
    secrets: inherit
