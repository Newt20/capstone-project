name: CD - Stage

# Manual deploy only, same rule as dev - merging into `stage` validates the
# promotion, it does not release it. A human decides when by clicking
# "Run workflow" (or `gh workflow run cd-stage.yml --ref stage`).
on:
  workflow_dispatch: {}

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      env_name: stage
      image_target: production
    secrets: inherit
