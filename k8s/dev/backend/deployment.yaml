apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-dev
  namespace: support-chat-dev
  labels:
    app: support-chat
    component: backend
    env: dev
spec:
  # Single instance only, deliberately: the app keeps connected-user
  # presence and per-socket rate limits in an in-memory Map with no
  # Socket.IO Redis adapter, so >1 replica would silently split chat
  # participants across pods. See understanding.md for the scale-out path.
  replicas: 1
  selector:
    matchLabels:
      component: backend
      env: dev
  template:
    metadata:
      labels:
        component: backend
        env: dev
    spec:
      containers:
        - name: backend
          # Bumped in-place by the cd-dev pipeline (sed on this line) after
          # each manual dispatch. Placeholder until the first real deploy.
          image: localhost:5001/support-chat-backend:dev-42a9c6c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "development"
            - name: CLIENT_URL
              value: "http://localhost:5173"
            - name: CHAT_PRIMARY_COLOR
              value: "#F59E0B"
            - name: CHAT_HEADER_COLOR
              value: "#F59E0B"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
