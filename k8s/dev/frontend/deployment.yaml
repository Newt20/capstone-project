apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dev
  namespace: support-chat-dev
  labels:
    app: support-chat
    component: frontend
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      component: frontend
      env: dev
  template:
    metadata:
      labels:
        component: frontend
        env: dev
    spec:
      containers:
        - name: frontend
          # Bumped in-place by the cd-dev pipeline (sed on this line) after
          # each manual dispatch.
          image: ghcr.io/Newt20/support-chat-frontend:dev-4cf6966
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              value: "http://localhost:5000"
            - name: VITE_SOCKET_URL
              value: "http://localhost:5000"
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
