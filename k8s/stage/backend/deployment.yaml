apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-stage
  namespace: support-chat-stage
  labels:
    app: support-chat
    component: backend
    env: stage
spec:
  # Single instance only - see k8s/dev/backend/deployment.yaml for why
  # (no Socket.IO Redis adapter in this codebase).
  replicas: 1
  selector:
    matchLabels:
      component: backend
      env: stage
  template:
    metadata:
      labels:
        component: backend
        env: stage
    spec:
      containers:
        - name: backend
          # Bumped in-place by the cd-stage pipeline (sed on this line)
          # after each manual dispatch. Placeholder until the first deploy.
          image: ghcr.io/OWNER/support-chat-backend:stage-init
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: CLIENT_URL
              value: "http://localhost:5174"
            - name: CHAT_PRIMARY_COLOR
              value: "#7C3AED"
            - name: CHAT_HEADER_COLOR
              value: "#7C3AED"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
