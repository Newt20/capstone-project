apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-prod
  namespace: support-chat-prod
  labels:
    app: support-chat
    component: frontend
    env: prod
spec:
  # Stateless static content served by nginx - safe and cheap to run
  # redundantly, unlike the backend (see backend/deployment.yaml).
  replicas: 2
  selector:
    matchLabels:
      component: frontend
      env: prod
  template:
    metadata:
      labels:
        component: frontend
        env: prod
    spec:
      containers:
        - name: frontend
          # Bumped in-place by the cd-prod pipeline (sed on this line),
          # triggered automatically when a PR against `prod` is opened.
          # Placeholder until the first deploy.
          image: ghcr.io/Newt20/support-chat-frontend:prod-3482811
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
